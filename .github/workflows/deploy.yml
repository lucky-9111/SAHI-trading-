# Deploy: every push to main (= merged pull request) runs the full CI and security checks again on that exact
# commit, packages it, and installs it on the EC2 server. Two server layouts are supported and detected automatically:
#   full  - bootstrapped with deploy/server/bootstrap.sh: sahi-deploy (staged release, verified backup, health gate, rollback)
#   opt   - the hand-built /opt/sahi + systemd "sahi" layout: deploy/bin/sahi-deploy-opt (backup, install, health gate, rollback)
# Manual re-run: Actions -> Deploy -> Run workflow (main only).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: Why are you deploying manually?
        required: true
        default: re-deploy

permissions:
  contents: read

# One production deployment at a time; a newer one waits instead of interrupting a running one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      build_release: true
    permissions:
      contents: read

  security:
    name: Security
    uses: ./.github/workflows/security.yml
    secrets: inherit           # GITLEAKS_LICENSE (organizations only); GITHUB_TOKEN is always available
    permissions:
      contents: read

  deploy:
    name: Deploy to EC2
    needs: [ci, security]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production          # add required reviewers here in GitHub settings for a manual approval gate
    permissions:
      contents: write           # push the deploy-* tag
      id-token: write           # only used when the optional AWS security-group step is configured
    env:
      RELEASE_NAME: ${{ needs.ci.outputs.release_name }}
      RELEASE_SHA256: ${{ needs.ci.outputs.release_sha256 }}
      SSH_USER: ${{ vars.EC2_SSH_USER || 'ubuntu' }}
      SSH_PORT: ${{ vars.EC2_SSH_PORT || '22' }}
    steps:
      - name: Check required secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          ok=1
          for v in EC2_HOST EC2_SSH_KEY EC2_SSH_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::GitHub secret $v is not set (Settings -> Environments -> production). See docs/CI_CD_SETUP.md"; ok=0; }
          done
          [ "$ok" = 1 ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out

      - name: Verify the artifact is this commit
        run: |
          cd out
          sha256sum -c "$RELEASE_NAME.sha256"
          [ "$(cut -d' ' -f1 "$RELEASE_NAME.sha256")" = "$RELEASE_SHA256" ]
          [ "$RELEASE_NAME" = "sahi-${GITHUB_SHA}.tar.gz" ]
          tar -xzOf "$RELEASE_NAME" ./REVISION | grep -qx "$GITHUB_SHA"
          echo "release $RELEASE_NAME verified"

      # Optional: open SSH to this runner only for the duration of the job (security group port 22 stays closed
      # otherwise). Enabled when the repository variables AWS_DEPLOY_ROLE_ARN, AWS_REGION and AWS_SG_ID are set.
      - name: AWS credentials (OIDC, optional)
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Allow this runner's IP on port 22 (optional)
        id: sg
        if: vars.AWS_DEPLOY_ROLE_ARN != ''
        env:
          SG_ID: ${{ vars.AWS_SG_ID }}
        run: |
          ip=$(curl -fsS -m 10 https://checkip.amazonaws.com | tr -d '[:space:]')
          [[ $ip =~ ^[0-9.]+$ ]] || { echo "::error::could not determine runner IP"; exit 1; }
          echo "::add-mask::$ip"
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=${SSH_PORT},ToPort=${SSH_PORT},IpRanges=[{CidrIp=${ip}/32,Description=github-actions-deploy}]" >/dev/null
          echo "ip=$ip" >>"$GITHUB_OUTPUT"
          sleep 5

      - name: SSH setup (pinned host key, dedicated deploy key)
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$EC2_SSH_KNOWN_HOSTS" >~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host sahi-prod
            HostName $EC2_HOST
            User $SSH_USER
            Port $SSH_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 8
            BatchMode yes
          EOF
          chmod 600 ~/.ssh/config

      - name: Verify the target server
        id: target
        run: |
          # host key must match EC2_SSH_KNOWN_HOSTS (StrictHostKeyChecking); find out which layout the server uses
          mode=$(ssh sahi-prod 'if test -x /usr/local/sbin/sahi-deploy && sudo -n -l /usr/local/sbin/sahi-deploy >/dev/null 2>&1; then echo full;
            elif systemctl cat sahi >/dev/null 2>&1 && test -x /opt/sahi/backend/.venv/bin/python && sudo -n true 2>/dev/null; then echo opt;
            else echo none; fi')
          live=$(ssh sahi-prod 'cat /opt/sahi/DEPLOYED_REVISION 2>/dev/null || echo none')
          echo "server layout: $mode; live revision: $live"
          [ "$mode" != none ] || { echo "::error::neither sahi-deploy nor the /opt/sahi + systemd 'sahi' layout was found (see docs/DEPLOYMENT_GUIDE.md)"; exit 1; }
          echo "mode=$mode" >>"$GITHUB_OUTPUT"

      - name: Upload release
        env:
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          if [ "$MODE" = full ]; then
            scp -q "out/$RELEASE_NAME" "sahi-prod:incoming/$RELEASE_NAME"
          else
            scp -q "out/$RELEASE_NAME" "sahi-prod:/tmp/$RELEASE_NAME"
            scp -q deploy/bin/sahi-deploy-opt "sahi-prod:/tmp/sahi-deploy-opt"
          fi

      - name: Install release (backup, switch, health gate, automatic rollback)
        env:
          MODE: ${{ steps.target.outputs.mode }}
        run: |
          # shellcheck disable=SC2029  # values are expanded here on purpose (validated again on the server)
          if [ "$MODE" = full ]; then
            ssh sahi-prod "sudo -n /usr/local/sbin/sahi-deploy /home/$SSH_USER/incoming/$RELEASE_NAME $GITHUB_SHA $RELEASE_SHA256"
          else
            ssh sahi-prod "bash /tmp/sahi-deploy-opt /tmp/$RELEASE_NAME $GITHUB_SHA $RELEASE_SHA256"
          fi

      - name: Public health check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for _ in $(seq 1 10); do
            if curl -fsS -m 10 -o /dev/null "http://$EC2_HOST/api/health/ready" \
               && curl -fsS -m 10 "http://$EC2_HOST/" | grep -q '<div id="root">'; then
              echo "public endpoint healthy"; exit 0
            fi
            sleep 3
          done
          echo "::error::the server reported success but the public URL is not healthy (security group / nginx?). The release is live on the server; check docs/TROUBLESHOOTING.md"
          exit 1

      - name: Tag the deployed commit
        run: |
          tag="deploy-$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::12}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "### Deployed \`${GITHUB_SHA::12}\` as \`$tag\`" >>"$GITHUB_STEP_SUMMARY"

      - name: Close SSH access again (optional)
        if: always() && steps.sg.outputs.ip != ''
        env:
          SG_ID: ${{ vars.AWS_SG_ID }}
          RUNNER_IP: ${{ steps.sg.outputs.ip }}
        run: |
          aws ec2 revoke-security-group-ingress --group-id "$SG_ID" \
            --ip-permissions "IpProtocol=tcp,FromPort=${SSH_PORT},ToPort=${SSH_PORT},IpRanges=[{CidrIp=${RUNNER_IP}/32}]" >/dev/null

      - name: Remove key material
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
