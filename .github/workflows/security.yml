# Security checks: secret scanning (full history), committed .env / key / database files, Python and npm
# dependency vulnerabilities, workflow least-privilege. Runs on pull requests, weekly, on demand, and is called
# by Deploy before every production deployment (a failure blocks the deploy). How to handle a finding:
# docs/PRODUCTION_SECURITY.md -> "Handling security alerts".
name: Security

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 3 * * 1"   # Mondays 03:30 UTC: catches newly published vulnerabilities in unchanged code
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks) + repo hygiene
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # scan the whole history, not only the last commit
          persist-credentials: false

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # only needed if the repo belongs to an organization

      - name: No committed .env / keys / databases / credentials
        run: bash deploy/ci/check-repo-hygiene.sh

      - name: Workflow permissions and action pinning
        run: python3 deploy/ci/check-workflows.py

  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: pip-audit (production lock file, known vulnerabilities fail the job)
        run: |
          python -m venv /tmp/audit
          /tmp/audit/bin/pip install --disable-pip-version-check --require-hashes --no-deps -r backend/requirements-dev.lock >/dev/null
          /tmp/audit/bin/pip-audit --strict --progress-spinner off --disable-pip --require-hashes -r backend/requirements.lock
          /tmp/audit/bin/pip-audit --progress-spinner off --disable-pip --require-hashes -r backend/requirements-dev.lock

  npm-deps:
    name: npm dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Shipped dependencies - high or critical fails
        run: npm audit --omit=dev --audit-level=high
      - name: Build tooling - critical fails
        run: npm audit --audit-level=critical
      - name: Lockfile integrity (registry signatures)
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit signatures
