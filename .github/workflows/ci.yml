# CI: backend (lint, unit + integration tests, production boot), frontend (types, tests, build), server config
# checks. Runs on pull requests to main and on pushes to work branches. The Deploy workflow calls this same
# file for every push to main (so main is never deployed without it) and asks it to package the release.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: ["feature/**", "fix/**", "hotfix/**", "chore/**", "release/**"]
  workflow_dispatch:
  workflow_call:
    inputs:
      build_release:
        description: Package the deployable release tarball (used by the Deploy workflow)
        type: boolean
        default: false
    outputs:
      release_name:
        description: File name of the release tarball artifact
        value: ${{ jobs.release.outputs.name }}
      release_sha256:
        description: SHA-256 of the release tarball
        value: ${{ jobs.release.outputs.sha256 }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14"   # same as the EC2 server (Ubuntu 26.04)
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (lint, tests, boot)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.lock
            backend/requirements-dev.lock

      - name: Install dependencies (hash-pinned lock files, clean venv)
        run: |
          python -m venv .venv
          .venv/bin/pip install --disable-pip-version-check --require-hashes --no-deps \
            -r requirements.lock -r requirements-dev.lock
          .venv/bin/pip check

      - name: Lock files match requirements.txt
        run: |
          # every package named in requirements.txt must be pinned in requirements.lock
          missing=0
          while read -r name; do
            grep -qiE "^${name}==" requirements.lock || { echo "::error::$name is in requirements.txt but not in requirements.lock - regenerate the lock (docs/CI_CD_SETUP.md)"; missing=1; }
          done < <(grep -vE '^\s*(#|$)' requirements.txt | sed -E 's/\[.*\]//; s/[<>=!~ ;].*//' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          exit $missing

      - name: Syntax check (byte-compile every module)
        run: .venv/bin/python -m compileall -q app scripts alembic

      - name: Ruff
        run: .venv/bin/ruff check --output-format=github .

      - name: Import check
        env:
          DISABLE_AUTO_SYNC: "1"
          DISABLE_ENGINE: "1"
          FEED_MODE: "off"
        run: .venv/bin/python -c "import app.main"

      - name: Unit tests
        run: .venv/bin/python -m pytest -m unit -q -p no:cacheprovider

      - name: Integration tests (API + SQLite)
        run: .venv/bin/python -m pytest -m integration -q -p no:cacheprovider

      - name: Every test ran (no unmarked tests skipped)
        run: |
          total=$(.venv/bin/python -m pytest --collect-only -q -p no:cacheprovider | tail -n1 | grep -oE '^[0-9]+')
          split=$(( $(.venv/bin/python -m pytest -m unit --collect-only -q -p no:cacheprovider | tail -n1 | grep -oE '^[0-9]+') \
                  + $(.venv/bin/python -m pytest -m integration --collect-only -q -p no:cacheprovider | tail -n1 | grep -oE '^[0-9]+') ))
          echo "collected $total, unit+integration $split"
          [ "$total" = "$split" ] || { echo "::error::some tests are neither unit nor integration"; exit 1; }

      - name: Production boot smoke test
        run: bash ../deploy/bin/smoke-boot.sh . .venv/bin/python

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install (exactly the lockfile)
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: No secrets in the bundle
        run: |
          # the browser bundle must never contain server-side configuration
          if grep -rEl 'ANGEL_(API_KEY|PASSWORD|TOTP_SECRET|CLIENT_CODE)|SECRET_KEY|BEGIN [A-Z ]*PRIVATE KEY' dist; then
            echo "::error::server-side secret names found in frontend/dist"; exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 3
          if-no-files-found: error

  config:
    name: Server config (shellcheck, nginx -t, sudoers)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Shellcheck deploy scripts
        working-directory: deploy
        run: |
          shellcheck --version | head -n2
          shellcheck -x -P bin -S warning bin/sahi-common.sh bin/sahi-deploy bin/sahi-rollback bin/sahi-backup \
            bin/sahi-restore bin/sahi-monitor bin/sahi-status bin/sahi-migrate-legacy bin/smoke-boot.sh \
            build-release.sh server/bootstrap.sh ci/check-repo-hygiene.sh

      - name: nginx -t on the site configuration
        run: |
          docker run --rm -v "$PWD/deploy/nginx/sahi.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.28.0-alpine nginx -t

      - name: sudoers syntax
        run: sudo visudo -cf deploy/server/sudoers-sahi-deploy

      - name: SQLite helper compiles
        run: python3 -m py_compile deploy/bin/sahi_sqlite.py

      - name: Workflow permissions and action pinning
        run: python3 deploy/ci/check-workflows.py

  release:
    name: Package release
    if: ${{ inputs.build_release }}
    needs: [backend, frontend, config]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      name: ${{ steps.pkg.outputs.name }}
      sha256: ${{ steps.pkg.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Build tarball of exactly this commit
        id: pkg
        run: |
          bash deploy/build-release.sh out
          name="sahi-${GITHUB_SHA}.tar.gz"
          echo "name=$name" >>"$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "out/$name.sha256")" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: out/
          retention-days: 30
          if-no-files-found: error
