# /etc/tmpfiles.d/sahi.conf - directories and cleanup rules (applied at boot and by bootstrap.sh)
d /var/lib/sahi        0750 sahi sahi -
# SmartAPI writes date-named log folders here (ERROR level only); delete those older than 30 days
d /var/lib/sahi/logs   0750 sahi sahi 30d
d /var/backups/sahi    0750 sahi sahi -
d /var/log/sahi        0750 root sahi -
