# SAHI Trading - nginx site. Installed by sahi-deploy to /etc/nginx/sites-available/sahi.conf (validated with
# `nginx -t` before every reload; the previous file is put back if validation fails).
# Plain HTTP on the instance's public IP. For HTTPS with a domain see docs/PRODUCTION_SECURITY.md.
# The backend listens on 127.0.0.1:8000 only; nothing but nginx is reachable from outside.

# Login / registration: 10 attempts per minute per client IP (burst 5), against password guessing.
limit_req_zone $binary_remote_addr zone=sahi_auth:10m rate=10r/m;
limit_req_status 429;

map $http_upgrade $sahi_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  root /opt/sahi/current/frontend/dist;
  index index.html;

  server_tokens off;
  client_max_body_size 1m;          # the API takes small JSON bodies only; no uploads
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;
  send_timeout 30s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # Security headers (repeated in locations that set their own add_header, as nginx does not inherit them).
  set $sahi_csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'";
  add_header Content-Security-Policy $sahi_csp always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Detailed feed / queue diagnostics are for the server itself (sahi-status), not the internet.
  location = /api/live/health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8000;
  }
  location = /health {
    allow 127.0.0.1;
    allow ::1;
    deny all;
    proxy_pass http://127.0.0.1:8000;
  }

  location ~ ^/api/auth/(login|register)$ {
    limit_req zone=sahi_auth burst=5 nodelay;
    proxy_pass http://127.0.0.1:8000;
  }

  location /api/ {
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy $sahi_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_pass http://127.0.0.1:8000;
  }

  # Live prices: browser websocket (upgrade + long read timeout; the server pings, idle sockets close after 1h).
  location /ws/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sahi_connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Hashed build assets never change: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Hidden files (.env, .git, release markers) are never served.
  location ~ /\. {
    deny all;
    return 404;
  }

  # React client-side routes fall back to index.html, which is never cached (new deploys show up immediately).
  location / {
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $sahi_csp always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    try_files $uri /index.html;
  }
}
