# Tool configuration only (the app is not packaged). Dependencies live in requirements*.txt / *.lock.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: no HTTP client / database fixture (fast, pure logic)",
    "integration: uses the FastAPI TestClient and a throwaway SQLite database",
]

[tool.ruff]
target-version = "py313"
line-length = 160
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Syntax errors, undefined names, unused imports/variables, broken comparisons. Style rules are deliberately
# not enforced: CI must catch real defects without forcing a rewrite of working code.
select = ["E9", "F"]
